name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.3'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - run: uv run --locked python benchmarks/verify_results.py
      - run: uv build --no-sources

  host-integration:
    name: Hermes integration / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMES_TEST_HOST: ${{ github.workspace }}/.hermes-test-host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: 34f8ec3b407e50bad3ae27e4cd79d65212061356
          path: .hermes-test-host
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.3'
          python-version: '3.14'
          enable-cache: false
      - name: Apply the bundled host patch
        run: git -C "$HERMES_TEST_HOST" apply "$GITHUB_WORKSPACE/compat/hermes-0.21.5-ingress.patch"
      - name: Run plugin tests in the amended host environment (no API keys)
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-test-home
        run: >-
          uv run --project "$HERMES_TEST_HOST" --frozen --group dev --extra telegram
          --with pytest-socket==0.7.0 --with-editable "$GITHUB_WORKSPACE"
          python -m pytest "$GITHUB_WORKSPACE/tests" -q
          --disable-socket --allow-unix-socket
