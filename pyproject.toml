[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-jev-reply-gate"
version = "0.1.0"
description = "Experimental scoped Jev reply policy for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.entry-points."hermes_agent.plugins"]
hermes-jev-reply-gate = "reply_gate:register"

[tool.setuptools]
packages = ["reply_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
