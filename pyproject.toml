[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-jev-reply-gate"
version = "0.1.0"
description = "Experimental scoped Jev reply policy for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-socket==0.7.0",
  "setuptools>=68",
  "wheel>=0.45",
  "ruff>=0.15,<1",
]

[tool.uv]
required-version = ">=0.12.3"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[project.entry-points."hermes_agent.plugins"]
hermes-jev-reply-gate = "reply_gate:register"

[tool.setuptools]
packages = ["reply_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--disable-socket --allow-unix-socket"
